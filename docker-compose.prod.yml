x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  ollama:
    <<: *logging
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 5G

  jaeger:
    <<: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  migrate:
    <<: *logging

  mcp:
    <<: [*hardening, *logging]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  api:
    <<: [*hardening, *logging]
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M