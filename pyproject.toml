[project]
name = "governed-rag-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mukul Sharma", email = "156288725+Mukuljr11@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.147.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
governed-rag-platform = "governed_rag_platform:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
